<body><link rel="preload" as="image" href="./feiwan-heart-eyes.webp?v=20260913-1"><main class="app"><section id="play-screen">
<header><button id="choose" class="text-button" disabled>‹ 关卡</button><h1 id="title">找肥丸</h1><button id="reset" class="text-button" disabled>重来</button></header>
<div id="hearts" class="hearts" aria-label="剩余2滴血"><span>♥</span><span>♥</span></div>
<p id="challenge-info" hidden>找到 +5 秒 · 点错 −5 秒</p>
<div class="feedback-controls"><button id="music-toggle" aria-pressed="true">BGM：开</button><button id="sound-toggle" aria-pressed="true">音效：开</button><button id="vibration-toggle" aria-pressed="true">震动：开</button></div>
<div class="rules"><p>每种颜色<br>只有 <b>1</b> 只肥丸</p><p>每行每列<br>只有 <b>1</b> 只肥丸</p><p>肥丸四周<br>不能有肥丸</p></div>
<div class="board-meta"><span>剩余肥丸：<b id="remaining">—</b></span><span id="countdown" hidden></span><span id="size"></span></div>
<div class="board-wrap"><div id="board" class="board" role="group" aria-label="寻找肥丸棋盘" aria-describedby="help"></div><div id="loading" class="loading" role="status"><p id="load-message">正在打开关卡…</p><button id="retry" hidden>重试</button></div></div>
<div class="board-options"><button id="pattern-toggle" type="button" aria-pressed="false">花纹：关</button></div>
<p id="help" class="help">单击打叉 / 取消 · 拖动连划 · 双击找肥丸</p><p id="status" class="status" role="status" aria-live="polite"></p>
</section><section id="levels-screen" hidden><header><button id="back" class="text-button">‹ 返回</button><h1>选择关卡</h1><span class="header-spacer"></span></header><div class="challenge-entries"><button id="daily-start" class="primary challenge-entry daily-entry">每日挑战<small id="daily-state"></small></button><button id="challenge-start" class="primary challenge-entry">极限挑战<small id="challenge-best">本机最佳：0 关</small></button></div><button id="learn-reasoning" class="lesson-entry" type="button">推理教学</button><p class="level-subtitle" id="completion"></p><div id="level-list"></div></section></main>
<dialog id="result-dialog"><div class="result-symbol" id="result-symbol" hidden>✦</div><div class="result-feiwan" role="img" aria-label="笑眯眯的肥丸"></div><h2 id="result-title"></h2><p id="result-message" hidden></p><p id="result-copy"></p><p id="result-best" hidden></p><div class="dialog-actions"><button id="result-levels" class="secondary">选择关卡</button><button id="result-action" class="primary">下一关</button></div></dialog>
<dialog id="reset-dialog"><h2>重新开始这关？</h2><p>清空标记，恢复两滴血。</p><div class="dialog-actions"><button id="cancel-reset" class="secondary">继续玩</button><button id="confirm-reset" class="primary">重新开始</button></div></dialog>
<dialog id="tutorial-dialog" aria-labelledby="tutorial-title"><h2 id="tutorial-title">一起找肥丸！</h2><div class="tutorial-instructions"><p><b>单击</b>格子：打叉；再点一次取消。</p><p><b>按住拖动</b>：从空格开始批量打叉，从叉开始批量清除。</p><p><b>双击</b>格子：确认肥丸位置。点错会扣 1 滴血，错误格子不能再点。</p><p>每行、每列、每种颜色各有 <b>1 只肥丸</b>，两只肥丸不能相邻（含斜角）。</p></div><button id="tutorial-start" class="primary">开始推理教学</button></dialog>
<aside id="update-notice" hidden role="status"><span>有新版本 · 刷新将重开当前关卡</span><button id="update-now" type="button">点击刷新</button></aside>
