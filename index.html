<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9ff"><title>找肥丸</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23a48bd3'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='48' fill='white'%3E★%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css?v=20260912-2"><link rel="preload" as="image" href="./feiwan.webp?v=20260912-2"></head>
<body><main class="app"><section id="play-screen">
<header><button id="choose" class="text-button" disabled>‹ 关卡</button><h1 id="title">找肥丸</h1><button id="reset" class="text-button" disabled>重来</button></header>
<div id="hearts" class="hearts" aria-label="剩余2滴血"><span>♥</span><span>♥</span></div>
<div class="feedback-controls"><button id="sound-toggle" aria-pressed="true">音效：开</button><button id="vibration-toggle" aria-pressed="true">震动：开</button></div>
<div class="rules"><p>每种颜色<br>只有 <b>1</b> 只肥丸</p><p>每行每列<br>只有 <b>1</b> 只肥丸</p><p>肥丸四周<br>不能有肥丸</p></div>
<div class="board-meta"><span>剩余肥丸：<b id="remaining">—</b></span><span id="size"></span></div>
<div class="board-wrap"><div id="board" class="board" role="group" aria-label="寻找肥丸棋盘" aria-describedby="help"></div><div id="loading" class="loading" role="status"><p id="load-message">正在打开关卡…</p><button id="retry" hidden>重试</button></div></div>
<p id="help" class="help">单击打叉 / 取消 · 拖动连划 · 双击找肥丸</p><p id="status" class="status" role="status" aria-live="polite"></p>
</section><section id="levels-screen" hidden><header><button id="back" class="text-button">‹ 返回</button><h1>选择关卡</h1><span class="header-spacer"></span></header><p class="level-subtitle" id="completion"></p><div id="level-list"></div></section></main>
<dialog id="result-dialog"><div class="result-symbol" id="result-symbol">✦</div><h2 id="result-title"></h2><p id="result-copy"></p><div class="dialog-actions"><button id="result-levels" class="secondary">选择关卡</button><button id="result-action" class="primary">下一关</button></div></dialog>
<dialog id="reset-dialog"><h2>重新开始这关？</h2><p>清空标记，恢复两滴血。</p><div class="dialog-actions"><button id="cancel-reset" class="secondary">继续玩</button><button id="confirm-reset" class="primary">重新开始</button></div></dialog>
<script type="module" src="./app.js?v=20260912-2"></script></body></html>
